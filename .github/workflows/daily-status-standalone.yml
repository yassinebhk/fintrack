name: daily-status-standalone

# DISABLED (2026-09-21): its own reason for existing — a Render/Neon-outage
# fallback — no longer applies now that the app is self-hosted on the VM with
# a local Postgres (if the VM is down, everything is down; this script pulling
# from an embedded snapshot doesn't add resilience anymore). Worse, its
# POSITIONS snapshot below is manually maintained and had silently drifted
# weeks out of date (missing positions bought since), so its afternoon send
# started CONTRADICTING the real one from the backend instead of backing it
# up. Replaced by two extra live-data sends on the VM's own scheduler
# (backend/app/scheduler.py::_portfolio_summary_extra_job, 14:00 + 21:30
# Europe/Madrid) — same real PortfolioService data as the 08:00 one, no
# hand-maintained snapshot to go stale. Kept here (not deleted) with
# workflow_dispatch only, in case a real standalone fallback is ever needed
# again — but update the embedded POSITIONS snapshot first if you do.
#
# Original doc, for context:
# Sends the daily portfolio table to Telegram, computed from LIVE prices
# (Yahoo/Coingecko) against an embedded positions snapshot. Depends on NOTHING
# in the backend, Render, or Neon — so it keeps working during an outage, unlike:
#   - daily-summary.yml            (needs the Render backend up)
#   - daily-summary-direct-stopgap (needs the Neon DB up)
#
# Required GitHub Secrets (already used by daily-summary-direct-stopgap.yml):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read              # for the guard step's `gh run list`

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Skip if today's status already went out (system-level idempotency)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          n=$(gh run list --workflow=daily-status-standalone.yml -L 30 \
                --json databaseId,conclusion,createdAt \
                --jq "[.[] | select(.conclusion==\"success\" and (.createdAt|startswith(\"$today\")) and (.databaseId != ${{ github.run_id }}))] | length")
          echo "successful runs already today: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "→ already sent today; this run will skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send daily portfolio status to Telegram
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/daily_status.py
