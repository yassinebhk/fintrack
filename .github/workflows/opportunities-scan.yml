name: opportunities-scan

# The heavy universe scan (now thousands of instruments, see market_scanner.py)
# would OOM the small VM. Run it here on GitHub's 7GB runner instead: scan +
# score everything with the project's own code, then POST the scored result to
# the backend, which does the light part (LLM analyst + enrichment) and serves
# it. (Project moved off Render to a self-hosted GCP VM — see deployment docs —
# the secrets below now point there, not at the old Render URL.)
#
# Required GitHub Secrets:
#   FINTRACK_INGEST_SECRET  — same value as CREATORS_INGEST_SECRET in the VM's backend/.env
#   FINTRACK_API_URL        — https://personalfintrack.duckdns.org/api
#   FINNHUB_API_KEY         — same value as FINNHUB_API_KEY in backend/.env
#                             (optional data provider: insider sentiment judge —
#                             without it that judge just silently doesn't vote)

on:
  schedule:
    # GH Actions cron doesn't observe DST, so a single fixed UTC time drifts
    # between 07:00 (CET, winter) and 08:00 (CEST, summer) Madrid — still
    # "before the morning view" either way. (Previously had two cron entries
    # meant to cover both cases, but neither is DST-aware, so it just ran the
    # — now much heavier — scan twice every single day for no real benefit.)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    # Universe grew from ~185 to potentially several thousand tickers (see
    # market_scanner.py::_screener_candidates) to make momentum_score/value_score
    # statistically representative — give it real headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: pip install --quiet -r backend/requirements.txt
      - name: Run universe scan and post to backend
        env:
          API_URL: ${{ secrets.FINTRACK_API_URL }}
          INGEST_SECRET: ${{ secrets.FINTRACK_INGEST_SECRET }}
          DATABASE_URL: "sqlite+aiosqlite:///./scan.db"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          cd backend
          python <<'PY'
          import math, os, asyncio, httpx
          from app.services.discovery.market_scanner import MarketScanner

          def _sanitize(obj):
              """NaN/Inf anywhere in the payload crash json.dumps() outright
              ("Out of range float values are not JSON compliant: nan") — this
              silently broke the scan for 2 days straight (2026-09-15/16) before
              a single pathological ticker was tracked down. Belt-and-suspenders:
              recursively scrub the whole payload right before sending, on top of
              fixing the specific known source, so a NEW stray NaN anywhere in
              the scoring pipeline degrades that one field instead of killing the
              entire day's scan."""
              if isinstance(obj, float):
                  return obj if math.isfinite(obj) else None
              if isinstance(obj, dict):
                  return {k: _sanitize(v) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [_sanitize(v) for v in obj]
              return obj

          async def main():
              sc = MarketScanner()
              themes, crypto = await asyncio.gather(
                  sc.scan_universe(), sc.scan_crypto_basket()
              )
              scored = [t for t in themes if t.get("factors")]
              print(f"Scanned {len(themes)} themes ({len(scored)} scored), {len(crypto)} crypto")
              if len(scored) < 10:
                  raise SystemExit("Too few scored instruments; aborting (won't overwrite good data)")

              api = os.environ["API_URL"].rstrip("/")
              secret = os.environ["INGEST_SECRET"]
              if not secret:
                  raise SystemExit("FINTRACK_INGEST_SECRET missing")
              r = httpx.post(
                  f"{api}/opportunities/ingest-scan",
                  params={"secret": secret},
                  json=_sanitize({"themes": themes, "crypto": crypto}),
                  timeout=180,
              )
              print("ingest-scan ->", r.status_code, r.text[:300])
              r.raise_for_status()

          asyncio.run(main())
          PY
