name: daily-summary

# Sends + pins the daily portfolio summary to Telegram. Runs from GitHub's servers,
# so it fires reliably even when Render's free tier has put the backend to sleep
# (internal APScheduler jobs don't keep a free dyno awake).
#
# Required GitHub Secrets (same as the other workers):
#   FINTRACK_API_URL        — e.g. https://fintrack-front.onrender.com/api
#   FINTRACK_INGEST_SECRET  — same value as CREATORS_INGEST_SECRET in Render env

on:
  schedule:
    # Several morning times as REDUNDANCY: GitHub Actions frequently delays or skips
    # scheduled runs. The endpoint is idempotent per day (only the first successful
    # send delivers; the rest skip), so firing multiple times never spams.
    - cron: "5 6 * * *"    # ≈ 08:05 Europe/Madrid
    - cron: "35 6 * * *"   # ≈ 08:35
    - cron: "20 7 * * *"   # ≈ 09:20
    - cron: "10 8 * * *"   # ≈ 10:10
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake backend then trigger pinned daily summary
        env:
          API_URL: ${{ secrets.FINTRACK_API_URL }}
          SECRET: ${{ secrets.FINTRACK_INGEST_SECRET }}
        run: |
          API="${API_URL%/}"
          # Render free tier sleeps; a cold start can outlast a single request's timeout.
          # Poll /health until the dyno is awake (200), up to ~4 min, THEN send.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API/health" || echo 000)
            echo "wake $i: $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          # Trigger the pinned daily summary, with retries.
          code=000
          for i in $(seq 1 3); do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
              -X POST "$API/notify/daily-summary?secret=${SECRET}")
            echo "send $i: HTTP $code"; cat /tmp/out.json 2>/dev/null; echo
            [ "$code" = "200" ] && break
            sleep 15
          done
          test "$code" = "200"
