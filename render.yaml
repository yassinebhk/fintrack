# FinTrack v2.0 — Render Blueprint
# Two services: backend (API + jobs) and frontend (static).
# Set secret env vars via Render dashboard (sync: false → never stored here).

services:
  - type: web
    name: fintrack-api
    env: python
    plan: free
    buildCommand: |
      cd backend &&
      pip install -r requirements.txt
    startCommand: |
      cd backend &&
      python -m app.scripts.migrate_legacy || true &&
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: HOST
        value: 0.0.0.0
      - key: BASE_CURRENCY
        value: EUR
      - key: TIMEZONE
        value: Europe/Madrid
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL_ORCHESTRATOR
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_AGENT
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_CHEAP
        value: gemini-2.5-flash-lite
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-2.5-flash-lite
      # Secrets — set these from Render dashboard (sync: false hides their values)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: KRAKEN_API_KEY
        sync: false
      - key: KRAKEN_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TR_PHONE
        sync: false
      - key: TR_PIN
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false

  - type: web
    name: fintrack-frontend
    env: static
    staticPublishPath: ./frontend
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: fintrack-api
          property: url
